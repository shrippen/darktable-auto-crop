[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kader"
version = "0.2.0"
description = "Erkennt den Bildrahmen abfotografierter Filmnegative und schneidet zu; Web-UI zur Pruefung, Ausgabe fuer darktable, RawTherapee, Lightroom (XMP) oder als Dateien."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["opencv-python-headless", "numpy", "pillow"]

[project.optional-dependencies]
raw = ["rawpy"]           # RAWs ohne darktable/RawTherapee entwickeln
tui = ["rich"]            # Terminal-Statusanzeige (--tui), fuer SSH/NAS-Sitzungen

[project.scripts]
kader = "companion.__main__:main"

[tool.setuptools]
py-modules = ["kader", "film_scale"]
packages = ["companion", "companion.targets"]

[tool.setuptools.package-data]
companion = ["static/*", "static/vendor/*", "static/vendor/fonts/*"]
