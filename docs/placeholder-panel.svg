Mono','Fira Code',monospace;font-size:13px;font-weight:400;letter-spacing:0px">Undo crop (all in this session)</text><text x="40" y="436" fill="#a89984" text-anchor="start" style="font-family:'JetBrains Mono','Fira Code',monospace;font-size:10.5px;font-weight:400;letter-spacing:0px">After detection: open images in darkroom to apply crops.</text><rect x="40" y="450" width="400" height="10" fill="#2a2826"/><rect x="40" y="450" width="248" height="10" fill="#fabd2f"/><text x="40" y="480" fill="#a89984" text-anchor="start" style="font-family:'JetBrains Mono','Fira Code',monospace;font-size:10.5px;font-weight:400;letter-spacing:0px">Progress and remaining time appear here during a run</text><g><rect x="304" y="14" width="162" height="26" fill="#fabd2f"/><text x="385" y="32" fill="#141312" text-anchor="middle" style="font-family:'JetBrains Mono','Fira Code',monospace;font-size:12px;font-weight:700;letter-spacing:2px">PLACEHOLDER</text></g></svg>