<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Placeholder: three example scans, too tight, correctly framed and too loose">
<rect width="800" height="500" fill="#2a2826"/>
<!-- column layout: three panels -->
<g font-family="'JetBrains Mono','Fira Code',monospace">

<!-- TOO TIGHT -->
<text x="20" y="34" fill="#fb4934" font-size="13" font-weight="700" letter-spacing="3">TOO TIGHT</text>
<rect x="20" y="50" width="234" height="400" fill="#1d2021" stroke="#fb4934" stroke-width="2"/>
<rect x="20" y="50" width="234" height="400" fill="#5a4a3a"/>
<circle cx="137" cy="250" r="34" fill="#d9b382"/>
<polygon points="20,450 90,340 130,395 165,360 210,415 254,450" fill="#3b3128"/>
<text x="137" y="480" fill="#a89984" font-size="11" text-anchor="middle" letter-spacing="1">no perforation in frame</text>

<!-- GOOD -->
<text x="283" y="34" fill="#b8bb26" font-size="13" font-weight="700" letter-spacing="3">GOOD</text>
<rect x="283" y="50" width="234" height="400" fill="#1d2021" stroke="#b8bb26" stroke-width="2"/>
<rect x="297" y="120" width="206" height="260" fill="#5a4a3a"/>
<circle cx="400" cy="250" r="30" fill="#d9b382"/>
<polygon points="297,360 355,270 390,315 420,285 460,325 503,360" fill="#3b3128"/>
<!-- perforation holes, top and bottom margin -->
<g fill="#141312">
<rect x="305" y="66" width="13" height="9" rx="2"/><rect x="305" y="365" width="13" height="9" rx="2"/>
<rect x="333" y="66" width="13" height="9" rx="2"/><rect x="333" y="365" width="13" height="9" rx="2"/>
<rect x="361" y="66" width="13" height="9" rx="2"/><rect x="361" y="365" width="13" height="9" rx="2"/>
<rect x="389" y="66" width="13" height="9" rx="2"/><rect x="389" y="365" width="13" height="9" rx="2"/>
<rect x="417" y="66" width="13" height="9" rx="2"/><rect x="417" y="365" width="13" height="9" rx="2"/>
<rect x="445" y="66" width="13" height="9" rx="2"/><rect x="445" y="365" width="13" height="9" rx="2"/>
<rect x="473" y="66" width="13" height="9" rx="2"/><rect x="473" y="365" width="13" height="9" rx="2"/>
</g>
<text x="400" y="480" fill="#a89984" font-size="11" text-anchor="middle" letter-spacing="1">frame + margin with holes</text>

<!-- TOO LOOSE -->
<text x="546" y="34" fill="#fabd2f" font-size="13" font-weight="700" letter-spacing="3">TOO LOOSE</text>
<rect x="546" y="50" width="234" height="400" fill="#1d2021" stroke="#fabd2f" stroke-width="2"/>
<rect x="600" y="160" width="126" height="160" fill="#5a4a3a"/>
<circle cx="663" cy="240" r="18" fill="#d9b382"/>
<polygon points="600,300 630,255 650,278 668,262 690,285 726,300" fill="#3b3128"/>
<g fill="#141312">
<rect x="608" y="200" width="8" height="6" rx="1"/><rect x="608" y="278" width="8" height="6" rx="1"/>
<rect x="624" y="200" width="8" height="6" rx="1"/><rect x="624" y="278" width="8" height="6" rx="1"/>
<rect x="640" y="200" width="8" height="6" rx="1"/><rect x="640" y="278" width="8" height="6" rx="1"/>
</g>
<text x="663" y="480" fill="#a89984" font-size="11" text-anchor="middle" letter-spacing="1">frame too small in file</text>

</g>
</svg>
